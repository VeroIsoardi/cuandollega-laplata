<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuándo llega · La Plata</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --bg:#fafafa; --fg:#111; --muted:#666; --card:#fff; --line:#e3e3e3; --accent:#0a6cff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; --card:#1b1b1b; --line:#2c2c2c; --accent:#5b9dff; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:0 0 12px; }
  h1 a { color:inherit; text-decoration:none; }
  button, select, input { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); width:100%; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border:0; }
  .row { display:flex; gap:8px; margin-bottom:10px; }
  .row > * { flex:1; }
  .stack > * { margin-bottom:10px; }
  ul { list-style:none; padding:0; margin:0; }
  li { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  li.click { cursor:pointer; }
  .muted { color:var(--muted); font-size:.9rem; }
  .eta { float:right; font-weight:600; }
  .line { font-weight:700; }
  .err { color:#d33; }
  .head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .head b { flex:1; }
  .star { width:auto; flex:0 0 auto; font-size:1.2rem; padding:6px 10px; }
  #map { height:260px; border-radius:8px; margin-bottom:10px; border:1px solid var(--line); }
  .bus-label { background:var(--accent); color:#fff; border:0; font-weight:700; padding:1px 5px; }
  .bus-label::before { display:none; }
  h2 { font-size:1rem; margin:16px 0 8px; }
</style>
</head>
<body>
<main>
  <h1><a href="#">🚌 Cuándo llega · La Plata</a></h1>
  <div id="app"></div>
</main>
<script>
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const api = async (name, params = {}) => {
  const res = await fetch(`/api/${name}?${new URLSearchParams(params)}`);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
};
const opts = (items, placeholder) =>
  `<option value="">${placeholder}</option>` + items.map(i => `<option value="${esc(i.codigo)}">${esc(i.descripcion)}</option>`).join('');
const stopName = p => `${p.callePrincipal} y ${p.calleInterseccion}`;
const stopItem = p => `<li class="click" data-stop="${esc(p.identificador)}" data-name="${esc(stopName(p))}">
  <b>${esc(stopName(p))}</b> <span class="muted">${esc(p.identificador)}</span>
  ${p.lineas ? `<div class="muted">${esc(p.lineas)}</div>` : ''}</li>`;
const stopHash = (id, name) => `#${new URLSearchParams(name ? { parada: id, n: name } : { parada: id })}`;
const bindStops = el => el.querySelectorAll('[data-stop]').forEach(li =>
  li.onclick = () => location.hash = stopHash(li.dataset.stop, li.dataset.name));

// Favorites: [{ id, name }] in localStorage (per-browser; may be unavailable in private mode).
const favs = {
  all() { try { return JSON.parse(localStorage.getItem('favs')) || []; } catch { return []; } },
  save(list) { try { localStorage.setItem('favs', JSON.stringify(list)); } catch {} },
  has(id) { return this.all().some(f => f.id === id); },
  toggle(id, name) {
    this.save(this.has(id) ? this.all().filter(f => f.id !== id) : [...this.all(), { id, name }]);
  },
};
const fail = (el, err) => el.innerHTML = `<p class="err">${esc(err.message)}</p>`;

let timer;

async function home() {
  const fav = favs.all();
  app.innerHTML = `
    ${fav.length ? `<h2>⭐ Favoritas</h2><ul id="favs">${fav.map(f => `<li class="click" data-stop="${esc(f.id)}" data-name="${esc(f.name)}">
      <b>${esc(f.name)}</b> <span class="muted">${esc(f.id)}</span></li>`).join('')}</ul><h2>Buscar</h2>` : ''}
    <div class="stack">
      <button class="primary" id="near">📍 Paradas cerca mío</button>
      <form class="row" id="byId"><input name="id" placeholder="Código de parada (ej. LP10217)" required><button style="flex:0 0 auto;width:auto">Ver</button></form>
      <select id="linea"><option>Cargando líneas…</option></select>
      <select id="calle" hidden></select>
      <select id="inter" hidden></select>
    </div>
    <ul id="list"></ul>`;
  const $ = id => document.getElementById(id), list = $('list');
  if ($('favs')) bindStops($('favs'));

  $('byId').onsubmit = e => { e.preventDefault(); location.hash = stopHash(e.target.id.value.trim().toUpperCase()); };

  $('near').onclick = () => {
    list.innerHTML = '<p class="muted">Buscando ubicación…</p>';
    navigator.geolocation.getCurrentPosition(async ({ coords }) => {
      try {
        const stops = await api('cercanas', { lat: coords.latitude, lng: coords.longitude });
        list.innerHTML = stops.length ? stops.map(stopItem).join('') : '<p class="muted">No hay paradas cerca.</p>';
        bindStops(list);
      } catch (err) { fail(list, err); }
    }, err => fail(list, err), { enableHighAccuracy: true, timeout: 10000 });
  };

  // Grab elements before any await: the user may navigate away while lines load.
  const linea = $('linea'), calle = $('calle'), inter = $('inter');

  linea.onchange = async () => {
    calle.hidden = inter.hidden = true; list.innerHTML = '';
    if (!linea.value) return;
    calle.innerHTML = opts(await api('calles', { codLinea: linea.value }), 'Calle…');
    calle.hidden = false;
  };
  calle.onchange = async () => {
    inter.hidden = true; list.innerHTML = '';
    if (!calle.value) return;
    inter.innerHTML = opts(await api('intersecciones', { codLinea: linea.value, codCalle: calle.value }), 'Esquina…');
    inter.hidden = false;
  };
  inter.onchange = async () => {
    if (!inter.value) return;
    try {
      const stops = await api('paradas', { codLinea: linea.value, codCalle: calle.value, codInterseccion: inter.value });
      list.innerHTML = stops.map(stopItem).join('');
      bindStops(list);
    } catch (err) { fail(list, err); }
  };

  try { linea.innerHTML = opts(await api('lineas'), 'Elegí una línea…'); }
  catch (err) { fail(list, err); }
}

async function stop(id, name) {
  const title = name || `Parada ${id}`;
  app.innerHTML = `<div class="head"><b>${esc(title)}</b> <span class="muted" id="upd"></span>
    <button class="star" id="star"></button></div>
    <div id="map" hidden></div><ul id="list"><p class="muted">Cargando…</p></ul>`;
  const list = document.getElementById('list'), star = document.getElementById('star');
  const paintStar = () => {
    const on = favs.has(id);
    star.textContent = on ? '★' : '☆';
    star.title = star.ariaLabel = on ? 'Quitar de favoritas' : 'Agregar a favoritas';
  };
  star.onclick = () => { favs.toggle(id, title); paintStar(); };
  paintStar();

  let map, layer;
  const drawMap = arribos => {
    const s = arribos.find(a => a.latitudParada);
    if (!s || !window.L) return; // no coordinates without arrivals, or Leaflet failed to load
    const stopLL = [parseFloat(s.latitudParada), parseFloat(s.longitudParada)];
    if (!map) {
      const el = document.getElementById('map');
      el.hidden = false;
      map = L.map(el).setView(stopLL, 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap',
      }).addTo(map);
      layer = L.layerGroup().addTo(map);
    }
    layer.clearLayers();
    L.circleMarker(stopLL, { radius: 9, color: '#d33', fillOpacity: .9 }).bindTooltip('Parada').addTo(layer);
    const buses = arribos.filter(a => a.latitud && a.longitud)
      .map(a => [parseFloat(a.latitud), parseFloat(a.longitud), a]);
    buses.forEach(([lat, lng, a]) =>
      L.circleMarker([lat, lng], { radius: 6, color: '#0a6cff', fillOpacity: .9 })
        .bindTooltip(esc(a.descripcionLinea), { permanent: true, direction: 'top', className: 'bus-label' })
        .bindPopup(`<b>${esc(a.descripcionLinea)}</b> · ${esc(a.tiempoRestanteArribo)}<br>${esc(a.descripcionCartelBandera || a.descripcionBandera)}`)
        .addTo(layer));
    if (!drawMap.fitted && buses.length) {
      map.fitBounds([stopLL, ...buses.map(([lat, lng]) => [lat, lng])], { padding: [30, 30], maxZoom: 16 });
      drawMap.fitted = true;
    }
  };

  const load = async () => {
    try {
      const { arribos } = await api('arribos', { codLinea: 0, idParada: id });
      drawMap(arribos);
      list.innerHTML = arribos.length ? arribos.map(a => `<li>
        <span class="eta">${esc(a.tiempoRestanteArribo)}</span>
        <span class="line">${esc(a.descripcionLinea)}</span> ${a.esAdaptado ? '♿' : ''}
        <div class="muted">${esc(a.descripcionCartelBandera || a.descripcionBandera)}</div></li>`).join('')
        : '<p class="muted">Sin arribos próximos.</p>';
      document.getElementById('upd').textContent = `· ${new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })}`;
    } catch (err) { fail(list, err); }
  };
  timer = setInterval(load, 30_000); // upstream rate-limits; don't go faster. Set before await so route() can clear it.
  load();
}

function route() {
  clearInterval(timer);
  const h = new URLSearchParams(location.hash.slice(1));
  h.get('parada') ? stop(h.get('parada'), h.get('n')) : home();
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
